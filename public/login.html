<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Tracker Sampah Plastik Laut</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="/assets/images/logounsoed.png" alt="UNSOED" class="logo-img">
        Tracker Sampah Plastik Laut
      </div>
      <div class="nav-links">
        <a href="mailto:jumantoro@mhs.unsoed.ac.id">CONTACT</a>
      </div>
    </div>

    <div class="login-section">
      <h1 class="login-title">Masuk dengan Akun Google UNSOED</h1>
      <a href="/auth/google">
        <img src="https://developers.google.com/identity/images/btn_google_signin_dark_normal_web.png" 
             alt="Login with Google" style="width: 220px;">
      </a>
      <div class="info-text">
        Hanya email <strong>@mhs.unsoed.ac.id</strong> atau <strong>@unsоed.ac.id</strong> yang diizinkan.
      </div>
    </div>

    <div class="illustration-section">
      <img src="/assets/images/illustration-login.png" alt="Illustration" class="illustration" onerror="this.style.display='none'">
    </div>

    <div class="footer">
      © 2025 Tracker Sampah Plastik Laut — Jumantoro L1C022006
    </div>
  </div>

  <script>
    // Tampilkan error jika ada
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    if (error === 'unauthorized') {
      alert('⚠️ Hanya pengguna dengan email UNSOED yang diizinkan.');
    } else if (error === 'session') {
      alert('❌ Sesi login tidak valid.');
    }
  </script>
</body>
</html>
